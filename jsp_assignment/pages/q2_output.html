<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Square of a Number - Output</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f7f6; margin: 0; padding: 25px; }
        .bar { background: #e2e8f0; padding: 8px 12px; border-radius: 8px 8px 0 0; font-family: monospace; font-size: 12px; color: #475569; border: 1px solid #cbd5e1; border-bottom: none; display: flex; align-items: center; gap: 8px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
        .r { background: #ff5f56; } .y { background: #ffbd2e; } .g { background: #27c93f; }
        .url { background: white; padding: 4px 10px; border-radius: 4px; flex-grow: 1; border: 1px solid #cbd5e1; color: #1e293b; font-size: 12px; }
        .frame { border: 1px solid #cbd5e1; border-radius: 0 0 8px 8px; background: white; padding: 30px 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); }
        .box { max-width: 420px; background: #fff; padding: 25px; border-radius: 8px; border: 1px solid #e2e8f0; margin: 0 auto; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        h2 { color: #2c3e50; border-bottom: 2px solid #8e44ad; padding-bottom: 8px; font-size: 18px; margin-top: 0; }
        label { font-weight: bold; display: block; margin-top: 14px; color: #34495e; font-size: 13px; }
        input[type="number"] { width: 100%; padding: 9px; margin-top: 5px; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box; font-size: 13px; }
        input[type="submit"] { background: #8e44ad; color: white; border: none; padding: 11px 16px; margin-top: 20px; border-radius: 4px; cursor: pointer; width: 100%; font-size: 14px; font-weight: bold; }
        .sqres { margin-top: 18px; padding: 14px; background: #f4ecf7; border-left: 4px solid #8e44ad; border-radius: 4px; color: #6c3483; font-size: 15px; }
    </style>
</head>
<body>
    <div class="bar"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><div class="url">http://localhost:8080/JSPAssignment/q2_square.jsp</div></div>
    <div class="frame">
        <div class="box">
            <h2>Calculate Square of a Number</h2>
            <form>
                <label>Enter a Number:</label>
                <input type="number" name="number" value="12">
                <input type="submit" value="Calculate Square">
            </form>
            <div class="sqres">The square of <strong>12.0</strong> is <strong>144.0</strong></div>
        </div>
    </div>
</body>
</html>
