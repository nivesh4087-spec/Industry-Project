<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Student Registration - Output</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f7f6; margin: 0; padding: 25px; }
        .bar { background: #e2e8f0; padding: 8px 12px; border-radius: 8px 8px 0 0; font-family: monospace; font-size: 12px; color: #475569; border: 1px solid #cbd5e1; border-bottom: none; display: flex; align-items: center; gap: 8px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
        .r { background: #ff5f56; } .y { background: #ffbd2e; } .g { background: #27c93f; }
        .url { background: white; padding: 4px 10px; border-radius: 4px; flex-grow: 1; border: 1px solid #cbd5e1; color: #1e293b; font-size: 12px; }
        .frame { border: 1px solid #cbd5e1; border-radius: 0 0 8px 8px; background: white; padding: 30px 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); }
        .box { max-width: 440px; background: #fff; padding: 25px; border-radius: 8px; border: 1px solid #e2e8f0; margin: 0 auto; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        h2 { color: #2c3e50; border-bottom: 2px solid #16a085; padding-bottom: 8px; font-size: 18px; margin-top: 0; }
        label { font-weight: bold; display: block; margin-top: 14px; color: #34495e; font-size: 13px; }
        input[type="text"], input[type="number"], select { width: 100%; padding: 9px; margin-top: 5px; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box; font-size: 13px; }
        input[type="submit"] { background: #16a085; color: white; border: none; padding: 11px 16px; margin-top: 20px; border-radius: 4px; cursor: pointer; width: 100%; font-size: 14px; font-weight: bold; }
        .card { margin-top: 18px; padding: 16px; background: #e8f8f5; border: 1px solid #a3e4d7; border-radius: 6px; }
        .card h3 { margin: 0 0 8px 0; color: #117864; font-size: 16px; border-bottom: 1px solid #a3e4d7; padding-bottom: 6px; }
        .row { margin: 6px 0; font-size: 14px; color: #2c3e50; }
        .lbl { font-weight: bold; color: #16a085; width: 100px; display: inline-block; }
    </style>
</head>
<body>
    <div class="bar"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><div class="url">http://localhost:8080/JSPAssignment/q3_student.jsp</div></div>
    <div class="frame">
        <div class="box">
            <h2>Student Information Form</h2>
            <form>
                <label>Student Name:</label>
                <input type="text" name="studentName" value="Nivesh Jain">
                <label>Age:</label>
                <input type="number" name="age" value="21">
                <label>Department:</label>
                <select name="department"><option selected>Computer Engineering</option></select>
                <input type="submit" value="Submit Student Details">
            </form>
            <div class="card">
                <h3>Submitted Student Details</h3>
                <div class="row"><span class="lbl">Name:</span> Nivesh Jain</div>
                <div class="row"><span class="lbl">Age:</span> 21 years old</div>
                <div class="row"><span class="lbl">Department:</span> Computer Engineering</div>
            </div>
        </div>
    </div>
</body>
</html>
