<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>User Login Portal - Success</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f7f6; margin: 0; padding: 25px; }
        .bar { background: #e2e8f0; padding: 8px 12px; border-radius: 8px 8px 0 0; font-family: monospace; font-size: 12px; color: #475569; border: 1px solid #cbd5e1; border-bottom: none; display: flex; align-items: center; gap: 8px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
        .r { background: #ff5f56; } .y { background: #ffbd2e; } .g { background: #27c93f; }
        .url { background: white; padding: 4px 10px; border-radius: 4px; flex-grow: 1; border: 1px solid #cbd5e1; color: #1e293b; font-size: 12px; }
        .frame { border: 1px solid #cbd5e1; border-radius: 0 0 8px 8px; background: white; padding: 30px 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); }
        .box { max-width: 420px; background: #fff; padding: 25px; border-radius: 8px; border: 1px solid #e2e8f0; margin: 0 auto; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        h2 { color: #2c3e50; border-bottom: 2px solid #2980b9; padding-bottom: 8px; font-size: 18px; margin-top: 0; }
        label { font-weight: bold; display: block; margin-top: 14px; color: #34495e; font-size: 13px; }
        input[type="text"], input[type="password"] { width: 100%; padding: 9px; margin-top: 5px; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box; font-size: 13px; }
        input[type="submit"] { background: #2980b9; color: white; border: none; padding: 11px 16px; margin-top: 20px; border-radius: 4px; cursor: pointer; width: 100%; font-size: 14px; font-weight: bold; }
        .ok { margin-top: 18px; padding: 14px; background: #d4efdf; border-left: 4px solid #27ae60; color: #1e8449; border-radius: 4px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="bar"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><div class="url">http://localhost:8080/JSPAssignment/q5_auth.jsp</div></div>
    <div class="frame">
        <div class="box">
            <h2>User Login Portal</h2>
            <form>
                <label>Username:</label>
                <input type="text" name="username" value="admin">
                <label>Password:</label>
                <input type="password" name="password" value="password123">
                <input type="submit" value="Login">
            </form>
            <div class="ok"><strong>Login Successful!</strong><br>Welcome back, <strong>admin</strong>. Access granted to system portal.</div>
        </div>
    </div>
</body>
</html>
